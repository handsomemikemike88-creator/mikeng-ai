# mikeng-ai.com course site behind the VPS's existing Traefik (host network, entrypoint websecure, certresolver letsencrypt).
# Secrets/values come from the project environment (Hostinger Docker Manager). NO values in this file.
# Router/service names are "mikengai*" so they don't clash with the salon project's "salon*" routers.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://mikeng-ai.com}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-0}          # 0 = noindex everywhere (default). Set 1 only at launch with Mikey's OK.
      BACKEND: ${BACKEND:-on}
      APP_SECRET: ${APP_SECRET}                      # required in production
      APP_DB: /data/app.db
      UPLOAD_DIR: /data/uploads
      OUTBOX_FILE: /data/outbox.jsonl
      SUBMISSIONS_FILE: /data/submissions.json
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      MEDIA_URL_TTL_MIN: ${MEDIA_URL_TTL_MIN:-120}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      STAFF_INVITE_CODE: ${STAFF_INVITE_CODE:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}           # first admin only; unset after it exists
      ADMIN_NAME: ${ADMIN_NAME:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}     # sk_test_ only; empty = checkout disabled / 「即將開放」
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MAP: ${STRIPE_PRICE_MAP:-}
    volumes:
      - mikengai-data:/data
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.mikengai.rule=Host(`mikeng-ai.com`) || Host(`www.mikeng-ai.com`)
      - traefik.http.routers.mikengai.entrypoints=websecure
      - traefik.http.routers.mikengai.tls.certresolver=letsencrypt
      - traefik.http.routers.mikengai.service=mikengai
      - traefik.http.services.mikengai.loadbalancer.server.port=3000
  backup:
    # Nightly backup of mikengai-data (read-only) into the named volume `mikengai-backups`.
    # One run at container start, then every day at 03:00 Asia/Hong_Kong. Keeps 14 days. No secrets.
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TZ: Asia/Hong_Kong
      BACKUP_HOUR: "03"
      KEEP_DAYS: "14"
    volumes:
      - mikengai-data:/data:ro
      - mikengai-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        apk add --no-cache sqlite tzdata >/dev/null || { echo "apk add failed" >&2; sleep 300; exit 1; }
        umask 077
        mkdir -p /backups
        run() {
          d="$$(date +%Y%m%d-%H%M%S)"; w="/backups/.work-$$d"; f="/backups/mikengai-$$d.tar.gz"
          mkdir -p "$$w"
          ok=1
          if [ -f /data/app.db ]; then
            sqlite3 "file:/data/app.db?mode=ro" ".backup '$$w/app.db'" && sqlite3 "$$w/app.db" "PRAGMA integrity_check;" | grep -qx ok || ok=0
          else
            echo "no /data/app.db yet"
          fi
          for x in submissions.json outbox.jsonl; do [ -f "/data/$$x" ] && cp "/data/$$x" "$$w/"; done
          [ -d /data/uploads ] && tar -C /data -cf "$$w/uploads.tar" uploads
          if [ "$$ok" = 1 ] && tar -C "$$w" -czf "$$f.tmp" . ; then
            mv "$$f.tmp" "$$f"
            echo "$$(date '+%F %T %Z') backup OK: $$f ($$(du -h "$$f" | cut -f1))"
          else
            rm -f "$$f.tmp"; echo "$$(date '+%F %T %Z') backup FAILED" >&2
          fi
          rm -rf "$$w"
          find /backups -name 'mikengai-*.tar.gz' -type f -mtime +$$((KEEP_DAYS - 1)) -print -delete
          echo "backups kept: $$(ls /backups | grep -c '^mikengai-.*\.tar\.gz$$')"
        }
        echo "backup service started; daily at $${BACKUP_HOUR}:00 $$TZ, keep $${KEEP_DAYS} days"
        sleep 10
        run
        while true; do
          now=$$(date +%s); next=$$(date -d "$$(date +%F) $${BACKUP_HOUR}:00:00" +%s 2>/dev/null)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          run
        done
volumes:
  mikengai-data:
  mikengai-backups:
